services:
  signalwatch:
    build: .
    container_name: signalwatch
    restart: unless-stopped
    ports:
      - "${MONITOR_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    volumes:
      - ./data:/app/data
    environment:
      MONITOR_SCAN_INTERVAL: "${MONITOR_SCAN_INTERVAL:-300}"
      MONITOR_HTTP_TIMEOUT: "${MONITOR_HTTP_TIMEOUT:-15}"
      MONITOR_ITEMS_PER_SOURCE: "${MONITOR_ITEMS_PER_SOURCE:-60}"
      MONITOR_AI_BASE_URL: "${MONITOR_AI_BASE_URL:-}"
      MONITOR_AI_API_KEY: "${MONITOR_AI_API_KEY:-}"
      MONITOR_AI_MODEL: "${MONITOR_AI_MODEL:-}"
      MONITOR_AI_WIRE_API: "${MONITOR_AI_WIRE_API:-chat_completions}"
      MONITOR_AI_TIMEOUT: "${MONITOR_AI_TIMEOUT:-45}"
      MONITOR_AI_MAX_ITEMS: "${MONITOR_AI_MAX_ITEMS:-20}"
      MONITOR_ALERT_WEBHOOK_URL: "${MONITOR_ALERT_WEBHOOK_URL:-}"
      MONITOR_ALERT_WEBHOOK_TYPE: "${MONITOR_ALERT_WEBHOOK_TYPE:-generic}"
      MONITOR_ALERT_MIN_RISK: "${MONITOR_ALERT_MIN_RISK:-medium}"
      MONITOR_ALERT_TIMEOUT: "${MONITOR_ALERT_TIMEOUT:-10}"
      MONITOR_SMTP_HOST: "${MONITOR_SMTP_HOST:-}"
      MONITOR_SMTP_PORT: "${MONITOR_SMTP_PORT:-465}"
      MONITOR_SMTP_USER: "${MONITOR_SMTP_USER:-}"
      MONITOR_SMTP_PASSWORD: "${MONITOR_SMTP_PASSWORD:-}"
      MONITOR_SMTP_FROM: "${MONITOR_SMTP_FROM:-}"
      MONITOR_ALERT_EMAIL_TO: "${MONITOR_ALERT_EMAIL_TO:-}"
      MONITOR_SMTP_SSL: "${MONITOR_SMTP_SSL:-true}"
